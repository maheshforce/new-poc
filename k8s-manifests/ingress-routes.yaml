---
# Jenkins Ingress Route (Path-Based ALB)
# Deploy with: kubectl apply -f jenkins-ingress.yaml
# Access at: http://ALB-DNS/jenkins

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins
  namespace: jenkins
  labels:
    app: jenkins
    version: v1
  annotations:
    # ALB configuration
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    
    # Health checks
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    
    # Tags for cost tracking
    alb.ingress.kubernetes.io/tags: 'Environment=Dev,Team=DevOps,App=Jenkins'
    
    # Load balancer attributes
    alb.ingress.kubernetes.io/load-balancer-attributes: |
      load_balancing.cross_zone.enabled=true,
      idle_timeout.connection.s=60
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /jenkins
            pathType: Prefix
            backend:
              service:
                name: jenkins
                port:
                  number: 80

