---
# Notes:
#
# These Ingress resources define path-based routing through a single ALB.
# The ALB Ingress Controller (deployed separately) will create/manage the actual AWS ALB.
#
# Prerequisites:
# 1. ALB Ingress Controller must be deployed first:
#    kubectl apply -f alb-ingress-controller-manifests.yaml
#
# 2. Namespaces and services must exist:
#    - jenkins namespace with jenkins service on port 80/8080
#    - karpenter namespace with karpenter service on port 8080
#    - keda namespace with keda-operator service on port 6443/80
#
# 3. IngressClass 'alb' must exist (created by ALB controller)
#
# Deployment:
# kubectl apply -f jenkins-ingress.yaml
# kubectl apply -f karpenter-ingress.yaml
# kubectl apply -f keda-ingress.yaml
#
# Verification:
# kubectl get ingress -n jenkins
# kubectl get ingress -n karpenter
# kubectl get ingress -n keda
# kubectl describe ingress jenkins -n jenkins  # See ALB DNS address
#
# Access:
# ALB_URL=$(kubectl get ingress -n jenkins -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}')
# curl http://$ALB_URL/jenkins
# curl http://$ALB_URL/karpenter
# curl http://$ALB_URL/keda
#
# Troubleshooting:
# - Check ALB controller logs: kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller
# - Verify service exists: kubectl get svc -n jenkins
# - Check pod endpoints: kubectl get endpoints -n jenkins
# - Describe ingress: kubectl describe ingress jenkins -n jenkins
