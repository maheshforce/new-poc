name: Helm Chart Lint and Validate

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'helm/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'helm/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'
    
    - name: Lint ArgoCD Chart
      run: helm lint ./helm/argocd
    
    - name: Lint Karpenter Chart
      run: helm lint ./helm/karpenter
    
    - name: Lint KEDA Chart
      run: helm lint ./helm/keda
    
    - name: Helm Template ArgoCD
      run: helm template argocd ./helm/argocd
    
    - name: Helm Template Karpenter
      run: helm template karpenter ./helm/karpenter
    
    - name: Helm Template KEDA
      run: helm template keda ./helm/keda
