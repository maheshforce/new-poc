apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "jenkins.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "jenkins.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "jenkins.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "jenkins.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jenkins.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "jenkins.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: jenkins
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        - name: jnlp
          containerPort: {{ .Values.service.jnlpPort }}
          protocol: TCP
        env:
        - name: JAVA_OPTS
          value: {{ .Values.javaOpts | quote }}
        - name: CASC_JENKINS_CONFIG
          value: /var/jenkins_home/casc_configs
        {{- if .Values.jenkinsUrl }}
        - name: JENKINS_URL
          value: {{ .Values.jenkinsUrl | quote }}
        {{- end }}
        - name: JENKINS_ADMIN_EMAIL
          value: {{ .Values.jenkinsAdminEmail | quote }}
        livenessProbe:
          httpGet:
            path: /login
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /login
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        volumeMounts:
        - name: jenkins-home
          mountPath: {{ .Values.persistence.mountPath }}
        {{- if .Values.controller.JCasC.enabled }}
        - name: casc-config
          mountPath: /var/jenkins_home/casc_configs
        {{- end }}
      volumes:
      {{- if .Values.controller.JCasC.enabled }}
      - name: casc-config
        configMap:
          name: {{ include "jenkins.fullname" . }}-casc-config
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: jenkins-home
      labels:
        {{- include "jenkins.labels" . | nindent 8 }}
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: {{ .Values.persistence.storageClassName }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
