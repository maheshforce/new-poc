apiVersion: v1
kind: Service
metadata:
  name: {{ include "argocd.fullname" . }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argocd.labels" . | nindent 4 }}
    component: server
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "argocd.selectorLabels" . | nindent 4 }}
    component: server
